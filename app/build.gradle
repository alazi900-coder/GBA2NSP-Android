plugins { id 'com.android.application' }

android {
    namespace 'com.nanita.gba2nsp'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.nanita.gba2nsp'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.9.0'
        ndk { abiFilters 'arm64-v8a' }
    }

    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
}
